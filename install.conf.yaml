- defaults:
    link:
      relink: true # Remove existing symlinks that point elsewhere
      create: true # Create parent directories if needed

- link:
    # --- Application Configurations ---

    # Ghostty config file
    ~/.config/ghostty/config:
      path: mbp/config/ghostty/config # Source path relative to repo root
      force: true
      if: '[ "$(uname)" = "Darwin" ] ' # Link on macOS 

    # Continue config file
    ~/.continue/config.yaml:
      path: mbp/continue/config.yaml # Source path relative to repo root
      if: '[ "$(uname)" = "Darwin" ]'  # Link on macOS 

    # --- Shell/Terminal Configurations ---

    # Tmux config file
    ~/.tmux.conf:
      path: mbp/tmux.conf # Source path relative to repo root
      if: '[ "$(uname)" = "Darwin" ]' 

    # Zsh config file
    ~/.zshrc:
      path: mbp/zshrc # Source path relative to repo root
      if: '[ "$(uname)" = "Darwin" ]' 

    # --- Neovim Configurations ---

    # Neovim colors directory
    # This will create a symlink at ~/.config/nvim/colors pointing to
    # your repo's config/nvim/colors directory.
    ~/.config/nvim/colors:
      path: mbp/config/nvim/colors # Source path relative to repo root
      if: '[ "$(uname)" = "Darwin" ]' # Link on macOS

    # Neovim lua directory 
    ~/.config/nvim/lua:
      path: mbp/config/nvim/lua 
      if: '[ "$(uname)" = "Darwin" ]'

    # Neovim init.lua file
    ~/.config/nvim/init.lua:
      path: mbp/config/nvim/init.lua # Source path relative to repo root
      if: '[ "$(uname)" = "Darwin" ] ' # Link on macOS

    # Git Config 
    ~/.gitconfig:
      path: mbp/gitconfig
      if:  '[ "$(uname)" = "Darwin" ] '

    # Aerospace
    ~/.aerospace.toml:
      path: mbp/aerospace.toml
      force: true
      if:  '[ "$(uname)" = "Darwin" ] '

    # Sketchybar
    ~/.config/sketchybar:
      path: mbp/config/sketchybar
      if:  '[ "$(uname)" = "Darwin" ] '

    # --- Local LLM / Agent Configurations ---

    # llama-server model presets
    ~/models/presets.ini:
      path: mbp/models/presets.ini
      if: '[ "$(uname)" = "Darwin" ]'

    # OpenCode config
    ~/.config/opencode/opencode.jsonc:
      path: mbp/config/opencode/opencode.jsonc
      if: '[ "$(uname)" = "Darwin" ]'

    # Pi agent models config
    ~/.pi/agent/models.json:
      path: mbp/pi/agent/models.json
      if: '[ "$(uname)" = "Darwin" ]'

    # Pi agent settings config
    ~/.pi/agent/settings.json:
      path: mbp/pi/agent/settings.json
      if: '[ "$(uname)" = "Darwin" ]'

    # llama-server LaunchAgent plist
    ~/Library/LaunchAgents/com.user.llama-server.plist:
      path: mbp/Library/LaunchAgents/com.user.llama-server.plist
      if: '[ "$(uname)" = "Darwin" ]'


- shell:
    - command: '[ "$(uname)" = "Darwin" ] && command -v aerospace >/dev/null 2>&1 && aerospace reload-config || true'
      description: Reload AeroSpace config (if running)

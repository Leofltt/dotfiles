name: leofltt-continue
version: 0.5.0

models:
  - name: Qwen 3.8 27B (Stock)
    provider: openai
    model: qwen3.8-stock 
    apiBase: http://127.0.0.1:8088/v1
    apiKey: none
    contextLength: 65536
    capabilities:
      - tool_use
    roles:
      - chat
      - edit
      - apply

  - name: Qwen 3.8 27B (Heretic Uncensored)
    provider: openai
    model: qwen3.8-heretic
    apiBase: http://127.0.0.1:8088/v1
    apiKey: none
    contextLength: 65536
    capabilities:
      - tool_use
    roles:
      - chat
      - edit
      - apply

tabAutocompleteModel:
  name: Qwen 3.8 27B Autocomplete
  provider: openai
  model: qwen3.8-stock 
  apiBase: http://127.0.0.1:8088/v1
  apiKey: none

context:
  - provider: file
  - provider: code
  - provider: diff
  - provider: currentFile
  - provider: terminal
  - provider: docs
  - provider: open
    params:
      onlyPinned: true
  - provider: web
    params:
      n: 10
  - provider: codebase
  - provider: folder
  - provider: search
  - provider: tree
  - provider: problems
  - provider: debugger
    params:
      stackDepth: 3